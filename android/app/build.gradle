plugins {
    id "com.android.application"
}

android {
    namespace "com.ninjatap.player"
    compileSdk 36

    defaultConfig {
        applicationId "com.ninjatap.player"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDir layout.buildDirectory.dir("generated/player-assets")
        }
    }
}

configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core:1.15.0"
}

def playerBinary = rootProject.file("../phone/target/aarch64-linux-android/release/ninjatap")

tasks.register("stagePlayer", Copy) {
    from playerBinary
    into layout.buildDirectory.dir("generated/player-assets")
    rename { "ninjatap" }
}

tasks.named("preBuild").configure {
    dependsOn("stagePlayer")
}
